<!doctype html>
<!-- NaviGO mudou de endereço: leva para o mesmo caminho em usenavigo.github.io (convites incluídos). -->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>NaviGO</title>
    <script>
      (function () {
        var NEW = 'https://usenavigo.github.io';
        var path = location.pathname.indexOf('/navigo') === 0 ? location.pathname : '/navigo/';
        location.replace(NEW + path + location.search + location.hash);
      })();
    </script>
  </head>
  <body style="font-family: system-ui, sans-serif; padding: 16px">
    <p>O NaviGO mudou de endereço. <a href="https://usenavigo.github.io/navigo/">Abrir o NaviGO</a></p>
  </body>
</html>
